# Swahn Chat on a Raspberry Pi (or any Docker host).
#   cp .env.example .env && edit .env       # at least SWAHNCHAT_SECRET_KEY
#   docker compose up -d --build            # backend only, listens on 127.0.0.1:8000
#   docker compose --profile caddy up -d    # + public HTTPS reverse proxy (ports 80/443)
#   docker compose --profile ntfy up -d     # + self-hosted UnifiedPush server (ntfy)
#   docker compose --profile tailscale up -d  # + Tailscale sidecar: HTTPS on your tailnet, no host-level tailscale
#   docker compose --profile turn up -d     # + coturn relay for audio/video calls (needs SWAHNCHAT_TURN_* in .env)
# Profiles can be made permanent with COMPOSE_PROFILES=caddy,ntfy,turn in .env (install-pi.sh does that).
# See ../docs/RASPBERRY_PI_SETUP.md.
name: swahnchat

services:
  backend:
    build:
      context: ../backend
    image: swahnchat-backend:latest
    env_file: .env
    volumes:
      - swahnchat-data:/data
    # Hardening: the process runs as an unprivileged user, writes only to /data and /tmp.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Never publish this on 0.0.0.0: it is plain HTTP. Tailscale or Caddy reach it on the host/network.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    profiles: ["caddy"]
    image: caddy:2.11.7   # pinned; bump deliberately (check the release notes), then `docker compose pull`
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SWAHNCHAT_DOMAIN: ${SWAHNCHAT_DOMAIN:-localhost}
      NTFY_DOMAIN: ${NTFY_DOMAIN:-ntfy.localhost}
      CADDY_MAX_UPLOAD: ${CADDY_MAX_UPLOAD:-110MB}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # ports 80/443
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates: keep this volume, Let's Encrypt rate-limits re-issuing
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ntfy:
    profiles: ["ntfy"]
    image: binwiederhier/ntfy:v2.33.1   # pinned; bump deliberately, then `docker compose pull`
    command: ["serve"]
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_ATTACHMENT_CACHE_DIR: ""
      NTFY_LISTEN_HTTP: ":80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # For `tailscale serve --https=8443 http://127.0.0.1:2586`; with the caddy profile Caddy reaches it as ntfy:80.
      - "127.0.0.1:2586:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/v1/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Tailscale sidecar: joins the tailnet as its own node (TS_HOSTNAME) and serves HTTPS 443 -> backend:8000 and
  # HTTPS 8443 -> ntfy:80 (see tailscale-serve.json). Userspace networking: no NET_ADMIN, no /dev/net/tun.
  # The first start needs TS_AUTHKEY in .env (later starts reuse the state volume). Not for use together with
  # `tailscale serve` on the host for the same ports.
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:v1.98.10   # pinned; bump deliberately, then `docker compose pull`
    hostname: ${TS_HOSTNAME:-swahnchat}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-swahnchat}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # coturn: TURN/STUN relay for calls (WebRTC). Calls go phone to phone when they can; this relays when they cannot.
  # Host networking on purpose: a relay needs the real source addresses and a UDP port range (49160-49200), which
  # Docker's port publishing NAT handles badly. It listens on 3478 (udp+tcp) and, with certificates in ./turn-certs, 5349.
  # Ports and the exposure story: docs/RASPBERRY_PI_SETUP.md, section "Calls". Do not publish ports with
  # network_mode: host; open them in the host firewall or router only for a public setup.
  turn:
    profiles: ["turn"]
    image: coturn/coturn:4.18.0   # pinned; bump deliberately (release notes), then `docker compose pull`
    network_mode: host
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/etc/coturn/turn-start.sh"]
    command: []
    environment:
      TURN_SECRET: ${SWAHNCHAT_TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-swahnchat}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_ALLOW_TAILNET_PEERS: ${TURN_ALLOW_TAILNET_PEERS:-false}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./turn-start.sh:/etc/coturn/turn-start.sh:ro
      - ${TURN_CERT_DIR:-./turn-certs}:/certs:ro   # optional fullchain.pem + privkey.pem for turns: on 5349
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # the turnserver binary carries this file capability; without it the exec is refused
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  swahnchat-data:
  caddy-data:
  caddy-config:
  ntfy-cache:
  tailscale-state:
