# coturn settings for Swahn Chat calls (compose profile `turn`). Contains no secrets: turn-start.sh appends the
# shared secret, realm, external IP, TLS files and the tailnet rule from the environment (see .env.example) and
# starts turnserver with the result. Only authenticated family members get credentials (GET /api/v1/calls/turn).

# TURN REST API: usernames are "<expiry>:<user_id>", the password is base64(HMAC-SHA1(secret, username)).
use-auth-secret

# Plain UDP/TCP on 3478. TLS (5349) is switched on by turn-start.sh when certificates are mounted.
listening-port=3478

# One small relay port range: open exactly this UDP range if the server is reachable from the internet.
min-port=49160
max-port=49200

# Hardening.
fingerprint
# The admin CLI and web admin are off by default (an explicit `no-cli` is deprecated and only logs an error).
# coturn 4.18 already requires TLS 1.2+ (TLS 1.0/1.1 only exist behind the opt-in flags `tlsv1`/`tlsv1_1`, which are
# not set here; the old `no-tlsv1` / `no-tlsv1_1` lines are rejected as "Bad configuration format"), starts no DTLS
# listener and refuses loopback peers unless `allow-loopback-peers` is set. All three are therefore left out.
no-software-attribute
# Media is relayed over UDP only (RFC 6062 TCP allocations are not needed for WebRTC).
no-tcp-relay
# Never relay to multicast destinations (loopback is refused by default, see above).
no-multicast-peers
# Nonces are valid for 10 minutes (reduces replay of captured requests).
stale-nonce=600

# Limits: a 1:1 call needs one allocation per phone. Per credential and for the whole server.
# Bytes per second and allocation (about 12 Mbit/s: enough for HD video).

# Logging to stdout (docker compose logs turn), without per-packet noise.
log-file=stdout
max-bps=1500000
total-quota=40
user-quota=10
pidfile=/tmp/turnserver.pid
simple-log

# Peers the relay may NOT send to. This stops a stolen credential from turning the Pi into a gateway into
# its own LAN, Docker networks, link-local and cloud metadata addresses.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# 100.64.0.0/10 (Tailscale CGNAT) is added by turn-start.sh unless TURN_ALLOW_TAILNET_PEERS=true.
