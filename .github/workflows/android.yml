name: FamilyChat Android

on:
  push:
    paths:
      - "familychat/android/**"
      - "familychat/backend/**" # the end-to-end test runs against the real backend
      - ".github/workflows/familychat-android.yml"
  pull_request:
    paths:
      - "familychat/android/**"
      - "familychat/backend/**"
      - ".github/workflows/familychat-android.yml"

permissions:
  contents: read

concurrency:
  group: familychat-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: familychat/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # detekt + detekt-formatting (ktlint rules); config/detekt/detekt.yml, existing findings in detekt-baseline.xml
      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familychat-detekt-reports
          path: familychat/android/**/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

  # Real runtime: SQLCipher, Android Keystore, Room migrations, libsignal, Tink and the R8-minified build on an emulator.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    defaults:
      run:
        working-directory: familychat/android
    steps:
      - uses: actions/checkout@v4

      # The emulator needs KVM; this is the udev rule from the android-emulator-runner README
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-google_apis-x86_64

      # Boots once to save the snapshot that later runs start from
      - name: Create AVD and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot"

      # Both test APKs are compiled first so that a compile error does not cost an emulator boot
      - name: Build test APKs
        run: ./gradlew assembleDebugAndroidTest --stacktrace && ./gradlew assembleQaAndroidTest -PtestBuildType=qa --stacktrace

      - name: Instrumented tests (debug build, then R8-minified qa build)
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: familychat/android
          script: ./gradlew connectedDebugAndroidTest --stacktrace && ./gradlew connectedQaAndroidTest -PtestBuildType=qa --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familychat-instrumented-reports-api${{ matrix.api-level }}
          path: |
            familychat/android/app/build/reports/androidTests/
            familychat/android/app/build/outputs/androidTest-results/
            familychat/android/app/build/outputs/mapping/qa/
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: familychat/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Sets ANDROID_HOME and installs the listed packages. local.properties is git-ignored and not needed:
      # the Android Gradle plugin falls back to ANDROID_HOME. The NDK is only used to strip libsignal_jni.so
      # (see docs/ANDROID_SETUP.md); without it the APK would be ~185 MB.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew scripts/run-e2e.sh

      - name: Build, unit tests, lint
        run: ./gradlew build --stacktrace

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: familychat/backend/requirements.txt

      - name: Backend virtualenv for the end-to-end test
        working-directory: familychat/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: End-to-end test (two users against a real backend)
        run: ./scripts/run-e2e.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familychat-debug-apk
          path: familychat/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familychat-android-reports
          path: |
            familychat/android/**/build/reports/
            familychat/android/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
