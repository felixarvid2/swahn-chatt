name: FamilyChat Android

on:
  push:
    paths:
      - "familychat/android/**"
      - "familychat/backend/**" # the end-to-end test runs against the real backend
      - ".github/workflows/familychat-android.yml"
  pull_request:
    paths:
      - "familychat/android/**"
      - "familychat/backend/**"
      - ".github/workflows/familychat-android.yml"

permissions:
  contents: read

concurrency:
  group: familychat-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: familychat/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Sets ANDROID_HOME and installs the listed packages. local.properties is git-ignored and not needed:
      # the Android Gradle plugin falls back to ANDROID_HOME. The NDK is only used to strip libsignal_jni.so
      # (see docs/ANDROID_SETUP.md); without it the APK would be ~185 MB.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew scripts/run-e2e.sh

      - name: Build, unit tests, lint
        run: ./gradlew build --stacktrace

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: familychat/backend/requirements.txt

      - name: Backend virtualenv for the end-to-end test
        working-directory: familychat/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: End-to-end test (two users against a real backend)
        run: ./scripts/run-e2e.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familychat-debug-apk
          path: familychat/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familychat-android-reports
          path: |
            familychat/android/**/build/reports/
            familychat/android/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
