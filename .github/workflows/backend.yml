name: FamilyChat backend

on:
  push:
    paths:
      - "familychat/backend/**"
      - "familychat/deployment/**"
      - ".github/workflows/familychat-backend.yml"
  pull_request:
    paths:
      - "familychat/backend/**"
      - "familychat/deployment/**"
      - ".github/workflows/familychat-backend.yml"

permissions:
  contents: read

concurrency:
  group: familychat-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: familychat/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            familychat/backend/requirements.txt
            familychat/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the Trivy SARIF report (Code scanning)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 here; the Pi's linux/arm64 image is built and smoke-tested in the next job.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: familychat/backend
          platforms: linux/amd64
          load: true
          tags: familychat-backend:ci
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64

      # Full report (all HIGH/CRITICAL, fixable or not) as a table in the log; never fails the build.
      - name: Trivy report (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: familychat-backend:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      - name: Trivy SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: familychat-backend:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-backend.sarif
          exit-code: "0"
          limit-severities-for-sarif: true

      # Needs "security-events: write" and Code scanning on the repository; fork pull requests get a read-only
      # token. Either way the report above is in the log, so a refused upload must not fail the build.
      - name: Upload SARIF
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # The gate: only a CRITICAL vulnerability that already has a fixed version breaks the build.
      - name: Trivy gate (fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: familychat-backend:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # The Pi runs linux/arm64. Build that image under QEMU and start it for real: wheels missing for aarch64,
  # a broken entrypoint or a migration that fails on arm64 show up here instead of on the Pi.
  docker-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: familychat-backend:ci-arm64
      # Throwaway key for the smoke test only (the server needs >= 32 bytes in production mode).
      FAMILYCHAT_SECRET_KEY: arm64-smoke-test-key-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: familychat/backend
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

      - name: Smoke test, import
        run: |
          docker run --rm --platform linux/arm64 -e FAMILYCHAT_SECRET_KEY --entrypoint python "$IMAGE" \
            -c "import platform, app.main; print('imported on', platform.machine())"

      - name: Smoke test, migrations on an empty volume
        run: |
          docker volume create fc-smoke-data
          docker run --rm --platform linux/arm64 -e FAMILYCHAT_SECRET_KEY -v fc-smoke-data:/data \
            --entrypoint alembic "$IMAGE" upgrade head
          docker run --rm --platform linux/arm64 -e FAMILYCHAT_SECRET_KEY -v fc-smoke-data:/data \
            --entrypoint alembic "$IMAGE" current

      - name: Smoke test, server answers /healthz and /readyz
        run: |
          docker run -d --name fc-smoke --platform linux/arm64 -e FAMILYCHAT_SECRET_KEY \
            -v fc-smoke-data:/data -p 127.0.0.1:8000:8000 "$IMAGE"
          ok=0
          for _ in $(seq 1 60); do # QEMU is slow: allow up to two minutes
            if curl -fsS http://127.0.0.1:8000/healthz; then ok=1; break; fi
            sleep 2
          done
          echo
          if [ "$ok" != 1 ]; then docker logs fc-smoke; exit 1; fi
          curl -fsS http://127.0.0.1:8000/readyz
          echo

      - name: Container logs
        if: always()
        run: docker logs fc-smoke || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f fc-smoke || true
          docker volume rm -f fc-smoke-data || true

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts (shellcheck)
        run: shellcheck --severity=warning familychat/deployment/*.sh familychat/backend/scripts/*.sh familychat/android/scripts/*.sh

      - name: Compose file parses with every profile
        working-directory: familychat/deployment
        run: |
          cp .env.example .env
          docker compose --profile caddy --profile ntfy --profile tailscale --profile turn config --quiet
