name: FamilyChat backend

on:
  push:
    paths:
      - "familychat/backend/**"
      - "familychat/deployment/**"
      - ".github/workflows/familychat-backend.yml"
  pull_request:
    paths:
      - "familychat/backend/**"
      - "familychat/deployment/**"
      - ".github/workflows/familychat-backend.yml"

permissions:
  contents: read

concurrency:
  group: familychat-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: familychat/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            familychat/backend/requirements.txt
            familychat/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 only: the Pi (arm64) image is built on the Pi itself.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: familychat/backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts (shellcheck)
        run: shellcheck --severity=warning familychat/deployment/*.sh familychat/backend/scripts/*.sh familychat/android/scripts/*.sh

      - name: Compose file parses with every profile
        working-directory: familychat/deployment
        run: |
          cp .env.example .env
          docker compose --profile caddy --profile ntfy --profile tailscale config --quiet
