name: FamilyChat release

# Push a tag such as `familychat-v1.0.0` to build the release APK and publish it as a GitHub release.
on:
  push:
    tags:
      - "familychat-v*"

permissions:
  contents: write # create the release

concurrency:
  group: familychat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: familychat/android
    env:
      TAG: ${{ github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.FAMILYCHAT_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.FAMILYCHAT_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.FAMILYCHAT_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.FAMILYCHAT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decide whether the APK can be signed
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/familychat-release.jks"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FAMILYCHAT_KEYSTORE_* secrets are not all set: building a release APK signed with the DEBUG key (not for distribution)."
          fi

      - name: Build release APK (signed)
        if: steps.signing.outputs.signed == 'true'
        run: >
          ./gradlew assembleRelease --stacktrace
          -Pfamilychat.keystore="$RUNNER_TEMP/familychat-release.jks"
          -Pfamilychat.keystorePassword="$KEYSTORE_PASSWORD"
          -Pfamilychat.keyAlias="$KEY_ALIAS"
          -Pfamilychat.keyPassword="$KEY_PASSWORD"

      # Without the -P flags app/build.gradle.kts signs the release variant with the debug key.
      - name: Build release APK (debug-signed)
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK and write SHA-256
        id: apk
        run: |
          version="${TAG#familychat-v}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            name="familychat-${version}.apk"
          else
            name="familychat-${version}-DEBUG-SIGNED.apk"
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/$name"
          (cd "$RUNNER_TEMP/out" && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$RUNNER_TEMP/out/$name" | grep -i 'SHA-256 digest'
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        working-directory: ${{ runner.temp }}/out
        run: |
          if [ "$SIGNED" = "true" ]; then
            flags=""
            notes="FamilyChat Android release \`$TAG\`, signed with the release key. Verify the download with \`sha256sum -c $APK_NAME.sha256\`."
          else
            flags="--prerelease"
            notes="RELEASE KEY MISSING: this APK is signed with the public debug key. Do not hand it to the family; set the FAMILYCHAT_KEYSTORE_* secrets and re-run (docs/ANDROID_SETUP.md). SHA-256 is in \`$APK_NAME.sha256\`."
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag --title "FamilyChat ${TAG#familychat-v}" --notes "$notes" $flags
