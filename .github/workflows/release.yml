name: Swahn Chat release

# Push a tag such as `swahnchat-v1.0.0` to build the release APK and publish it as a GitHub release, or run the
# workflow by hand with a version: it then creates the tag `swahnchat-v<version>` on the commit it built.
on:
  push:
    tags:
      - "swahnchat-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the prefix, e.g. 0.6.0 (must match versionName in app/build.gradle.kts)"
        required: true

permissions:
  contents: write # create the release

concurrency:
  group: swahnchat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('swahnchat-v{0}', inputs.version) || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.SWAHNCHAT_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.SWAHNCHAT_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SWAHNCHAT_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SWAHNCHAT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the app
        run: |
          want="${TAG#swahnchat-v}"
          have=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$want" != "$have" ]; then echo "::error::tag $TAG does not match versionName $have"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decide whether the APK can be signed
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swahnchat-release.jks"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SWAHNCHAT_KEYSTORE_* secrets are not all set: building a release APK signed with the DEBUG key (not for distribution)."
          fi

      - name: Build release APK (signed)
        if: steps.signing.outputs.signed == 'true'
        run: >
          ./gradlew assembleRelease --stacktrace
          -Pswahnchat.keystore="$RUNNER_TEMP/swahnchat-release.jks"
          -Pswahnchat.keystorePassword="$KEYSTORE_PASSWORD"
          -Pswahnchat.keyAlias="$KEY_ALIAS"
          -Pswahnchat.keyPassword="$KEY_PASSWORD"

      # Without the -P flags app/build.gradle.kts signs the release variant with the debug key.
      - name: Build release APK (debug-signed)
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK and write SHA-256
        id: apk
        run: |
          version="${TAG#swahnchat-v}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            name="swahnchat-${version}.apk"
          else
            name="swahnchat-${version}-DEBUG-SIGNED.apk"
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/$name"
          (cd "$RUNNER_TEMP/out" && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$RUNNER_TEMP/out/$name" | grep -i 'SHA-256 digest'
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        working-directory: ${{ runner.temp }}/out
        run: |
          if [ "$SIGNED" = "true" ]; then
            flags=""
            notes="Swahn Chat Android release \`$TAG\`, signed with the release key. Verify the download with \`sha256sum -c $APK_NAME.sha256\`."
          else
            flags="--prerelease"
            notes="RELEASE KEY MISSING: this APK is signed with the public debug key. Do not hand it to the family; set the SWAHNCHAT_KEYSTORE_* secrets and re-run (docs/ANDROID_SETUP.md). SHA-256 is in \`$APK_NAME.sha256\`."
          fi
          # shellcheck disable=SC2086
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            flags="$flags --target $GITHUB_SHA" # creates the tag on the commit that was built
          else
            flags="$flags --verify-tag"
          fi
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" --repo "$GITHUB_REPOSITORY" --title "Swahn Chat ${TAG#swahnchat-v}" --notes "$notes" $flags
